name: Build Solaris 2
on: [push, workflow_dispatch]
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Linux deps
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev libx11-dev libxcomposite-dev libxcursor-dev libxext-dev libxinerama-dev libxrandr-dev libxrender-dev libfreetype-dev libfontconfig1-dev libgl1-mesa-dev
      - name: Configure
        run: cmake -B build -DCMAKE_BUILD_TYPE=Release -DSOLARIS_INSTALL_AFTER_BUILD=OFF
      - name: Build
        run: cmake --build build --config Release -j 4

      # ---------- Windows: one-click installer ----------
      - name: Windows installer
        if: runner.os == 'Windows'
        continue-on-error: true
        shell: pwsh
        run: |
          if (-not (Test-Path "C:\Program Files (x86)\Inno Setup 6\ISCC.exe")) { choco install innosetup -y --no-progress }
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" installer.iss
      - name: Upload Windows installer
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: Solaris2-Windows-Installer
          path: Output/Solaris2-Setup.exe
          if-no-files-found: ignore

      # ---------- plain VST3 bundles for every platform ----------
      - uses: actions/upload-artifact@v4
        with:
          name: Solaris2-VST3-${{ matrix.os }}
          path: build/Solaris2_artefacts/**/VST3/*.vst3
